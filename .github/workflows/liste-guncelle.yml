
name: Medya Havuzu - TV Film Dizi

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: write

concurrency:
  group: medya-havuzu-liste
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: M3U listelerini yenile
        run: python guncelle.py

      - name: Dosyalari GitHub'a kaydet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- \
            canli_tv.m3u \
            filmler.m3u \
            diziler.m3u \
            tum_icerikler.m3u \
            durum.json

          if ! git diff --cached --quiet; then
            git commit -m 'Otomatik TV film ve dizi listesi guncellemesi'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
