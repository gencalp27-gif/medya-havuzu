name: Listeyi Otomatik Guncelle

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scripti Calistir
        run: python guncelle.py

      - name: Guncel Dosyayi Kaydet
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add canli_tv.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik liste guncellemesi" && git push)
