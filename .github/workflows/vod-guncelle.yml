
name: Medya Havuzu VOD Guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: medya-havuzu-vod
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Film ve dizileri guncelle
        run: python guncelle.py

      - name: Dosyalari GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filmler.m3u diziler.m3u tum_icerikler.m3u durum.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Otomatik film dizi guncellemesi"
            git push
          fi
